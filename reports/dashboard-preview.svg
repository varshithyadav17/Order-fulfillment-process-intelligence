<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Order Fulfillment Intelligence — analytical preview</title>
<desc id="desc">A summary of 2,000 synthetic orders, 32.8 percent late delivery, 41.02 average fulfillment hours, stage durations and late rates by carrier.</desc>
<rect width="1200" height="690" rx="18" fill="#f4f7fb"/>
<rect x="0" y="0" width="1200" height="104" rx="18" fill="#152a46"/><rect x="0" y="84" width="1200" height="20" fill="#152a46"/>
<text x="38" y="47" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Order Fulfillment Intelligence</text>
<text x="40" y="76" font-family="Arial, sans-serif" font-size="14" fill="#c7d8ec">Synthetic scenario • 2,000 orders • Reproducible Python + SQL analysis</text>
<g font-family="Arial, sans-serif">
  <rect x="32" y="127" width="270" height="100" rx="13" fill="#ffffff" stroke="#d9e2ef"/><text x="52" y="157" font-size="14" fill="#5b6b82">TOTAL ORDERS</text><text x="52" y="198" font-size="32" font-weight="700" fill="#172f4d">2,000</text>
  <rect x="322" y="127" width="270" height="100" rx="13" fill="#ffffff" stroke="#d9e2ef"/><text x="342" y="157" font-size="14" fill="#5b6b82">LATE DELIVERY RATE</text><text x="342" y="198" font-size="32" font-weight="700" fill="#bd4b43">32.8%</text>
  <rect x="612" y="127" width="270" height="100" rx="13" fill="#ffffff" stroke="#d9e2ef"/><text x="632" y="157" font-size="14" fill="#5b6b82">ON-TIME RATE</text><text x="632" y="198" font-size="32" font-weight="700" fill="#28765b">67.2%</text>
  <rect x="902" y="127" width="266" height="100" rx="13" fill="#ffffff" stroke="#d9e2ef"/><text x="922" y="157" font-size="14" fill="#5b6b82">AVG. FULFILLMENT</text><text x="922" y="198" font-size="32" font-weight="700" fill="#172f4d">41.02 h</text>
  <rect x="32" y="246" width="555" height="310" rx="13" fill="#ffffff" stroke="#d9e2ef"/><text x="56" y="281" font-size="18" font-weight="700" fill="#172f4d">Average time by stage</text><text x="56" y="305" font-size="12" fill="#697a90">Mean hours • dataset-generated scenario</text>
  <text x="56" y="355" font-size="14" fill="#43536a">Warehouse processing</text><rect x="56" y="365" width="465" height="20" rx="5" fill="#e5ebf3"/><rect x="56" y="365" width="92" height="20" rx="5" fill="#5a84bc"/><text x="535" y="380" font-size="14" font-weight="700" text-anchor="end" fill="#172f4d">6.29 h</text>
  <text x="56" y="417" font-size="14" fill="#43536a">Handoff</text><rect x="56" y="427" width="465" height="20" rx="5" fill="#e5ebf3"/><rect x="56" y="427" width="43" height="20" rx="5" fill="#5a84bc"/><text x="535" y="442" font-size="14" font-weight="700" text-anchor="end" fill="#172f4d">2.92 h</text>
  <text x="56" y="479" font-size="14" fill="#43536a">Transit</text><rect x="56" y="489" width="465" height="20" rx="5" fill="#e5ebf3"/><rect x="56" y="489" width="465" height="20" rx="5" fill="#e28b52"/><text x="535" y="504" font-size="14" font-weight="700" text-anchor="end" fill="#172f4d">31.81 h</text>
  <text x="56" y="536" font-size="12" fill="#697a90">Transit accounts for 77.55% of mean fulfillment duration.</text>
  <rect x="606" y="246" width="562" height="310" rx="13" fill="#ffffff" stroke="#d9e2ef"/><text x="630" y="281" font-size="18" font-weight="700" fill="#172f4d">Late delivery by carrier</text><text x="630" y="305" font-size="12" fill="#697a90">Late orders / orders in carrier group</text>
  <text x="630" y="355" font-size="14" fill="#43536a">SwiftShip • n=693</text><rect x="630" y="365" width="465" height="22" rx="5" fill="#e5ebf3"/><rect x="630" y="365" width="95" height="22" rx="5" fill="#5a84bc"/><text x="1110" y="381" font-size="14" font-weight="700" fill="#172f4d">20.35%</text>
  <text x="630" y="417" font-size="14" fill="#43536a">ParcelPro • n=646</text><rect x="630" y="427" width="465" height="22" rx="5" fill="#e5ebf3"/><rect x="630" y="427" width="140" height="22" rx="5" fill="#5a84bc"/><text x="1110" y="443" font-size="14" font-weight="700" fill="#172f4d">30.03%</text>
  <text x="630" y="479" font-size="14" fill="#43536a">ValueFreight • n=661</text><rect x="630" y="489" width="465" height="22" rx="5" fill="#e5ebf3"/><rect x="630" y="489" width="226" height="22" rx="5" fill="#e28b52"/><text x="1110" y="505" font-size="14" font-weight="700" fill="#172f4d">48.56%</text>
  <text x="630" y="536" font-size="12" fill="#697a90">Generated carrier assumptions intentionally create variation.</text>
  <rect x="32" y="576" width="1136" height="80" rx="13" fill="#fff9e9" stroke="#efdfb0"/><text x="56" y="606" font-size="15" font-weight="700" fill="#755821">Interpretation note</text><text x="56" y="630" font-size="13" fill="#755821">All values are from synthetic data. Segment comparisons are descriptive, not causal; late-order value is not lost revenue.</text>
  <text x="40" y="678" font-size="11" fill="#718096">Static visual preview based on validated pipeline outputs; the interactive Streamlit app supports filters and order-level exploration.</text>
</g>
</svg>
